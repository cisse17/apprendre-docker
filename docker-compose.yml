
services:
  redis:
    image: redis:8.0.4-alpine
    container_name: redis
    ports:
      - 6379:6379

  db:
    image: postgres:15-alpine        
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: ./
    container_name: django-note-app
    command: > 
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - /app/staticfiles      #  protège le dossier généré au build
    ports:
      - 8000:8000
    env_file:
      - .env                          # lit le .env automatiquement
    depends_on:
      - redis
      - db

  celery:
    build:
      context: ./
    container_name: celery
    command: celery -A crud worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - web

  celery_beat:
    build:
      context: ./
    container_name: celery-beat
    command: celery -A crud beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - web

volumes:
  postgres_data:

      
   


    
    
      