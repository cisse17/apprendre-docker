<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #4CAF50; color: white; padding: 20px; text-align: center; border-radius: 10px 10px 0 0; }
        .note-card { background: #f9f9f9; padding: 20px; margin: 20px 0; border-radius: 8px; border-left: 4px solid #4CAF50; }
        .stats { background: white; padding: 15px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📝 Nouvelle note créée</h1>
    </div>
    
    <div class="note-card">
        <h2>Titre : {{ note_title }}</h2>
        
        <div class="stats">
            <strong>👤 Auteur :</strong> {{ username }}<br>
            <strong>📅 Date :</strong> {{ created_at }}<br>
            <strong>📊 Mots :</strong> {{ word_count }}<br>
            <strong>⏱️ Temps de lecture :</strong> {{ reading_time }} min
        </div>
        
        <h3>Contenu :</h3>
        <div style="background: white; padding: 15px; border-radius: 5px; white-space: pre-wrap;">{{ note_content }}</div>
        
        <p style="text-align: center; margin-top: 20px;">
            <a href="{{ note_url }}" style="background: #4CAF50; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">
                Voir la note
            </a>
        </p>
    </div>
    
    <div style="text-align: center; color: #666; font-size: 12px; margin-top: 30px;">
        <p>Vous recevez cet email car vous avez créé une nouvelle note.</p>
    </div>
</body>
</html>
